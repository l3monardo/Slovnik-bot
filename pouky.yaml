help:
  text: |
    **Искати по језыку:**
    `.en dog` 
    `.ms krugly stol` 
    `.ср разумети`, и тако даље

    Можливе језыкы и јих коды:
    `isv` меджусловјанскы, `en` англијскы, `ru` русскы, `be` бєлорусскы, `uk` украјинскы, `pl` пољскы, `cs` чешскы, `sk` словачскы, `bg` булгарскы, `mk` македонскы, `sr` србскы, `hr` хрватскы, `sl` словенечскы.

    **Да бы показати слово по јего ID:**
    `.id 474`

    **Склоњенје и спреженје слова:**
    `.ru жираф скл` или `.ru жираф decl`
    `.ru бегать спр` или `.ru бегать conj`
    `.id 474 скл`

    **Искати во вики:**
    `.wiki en katana`
    `.wiki_summary ru собака`

    **Приказы за показыванје поук:**
    `.linky1`, `.linky2`, `.pasivno_učenje`, `.kako_učiti`, `.slovnik1`, `.slovnik2`, `.o_frazniku`, `.o_botu`, `.keyboards`

    **Да бы обновити дане:**
    `.obnovi slovnik` — обновити једино официалны словник
    `.obnovi fraznik` — обновити наш фразник
    `.obnovi Cognates` — обновити корпус слов
    `.obnovi` — обновити всечто