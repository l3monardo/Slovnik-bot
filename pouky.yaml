pouka4:
  text: |
    # Како се учити

    Прочитај немного [о граматикє](http://steen.free.fr/interslavic/grammar.html) (или [тут](https://interslavic-dictionary.com/grammar)), [писанју](http://steen.free.fr/interslavic/orthography.html) и [читанју](http://steen.free.fr/interslavic/pronunciation.html). Прєкладај слова в [словнику](https://interslavic-dictionary.com/). Говори с људами в [Discord-серверу](https://discord.gg/8hBqtf4uej) или [Телеграм-групє](https://t.me/MSbesieda) и гледи како говорет они.

    [Видео с ресурсами за ученје меджусловјанского](https://youtu.be/zOgTPTV6Sso)

    `.kako_učiti`


pouka5:
  text: |
    # Наставјенја словника

    В наставјенјах [словника](https://interslavic-dictionary.com/) можно избрати свој језык.

    Такоже там јест много другых можностиј, како опционалне језыкы 🇳🇱 🇩🇪 🇪🇸, измєњенје названиј/поредка падежев, исканје на меджусловјанском по измєњеных формах слов и тако даље.

    `.slovnik1`
  image:
    https://img4.teletype.in/files/77/ef/77ef35fa-16e8-400c-b419-79aa63145e6f.png


pouka6:
  text: |
    # [Словник](https://interslavic-dictionary.com/grammar)

    ## Како искати слова

    Да бы прєвести слово, избери из какого језыка трєба је прєкладати и впиши потрєбно слово.

    **Важно примєчание:** то јест словник, а не автоматичны прєводитељ. То значи, же он не може разумєти фразы или различне од инфинитива формы слов.

    `бежать, běžet, chcieć, трчати, дърво` — Добре запыты 👍🏻
    `бежала, psi utekli, chciałam, трчање, дръвче` — Недобре 👎🏻

    ## Ако ли в словнику јест нєколико вариантов нєкторого слова:"

    Отвори "прєклады/translations" под всакым вариантом. Там можно увидєти, како слово јест в највеликој коликости словјанскых језыков.    

    ## О формах слов

    Не забывај, же словник има функцију "склоњенја/declension"! Всаку можливу форму слова можно увидєти там.

    `.slovnik2`
  image:
    https://img2.teletype.in/files/db/6e/db6ef4da-9e27-4f9b-8a9f-ba4b29f17b19.png



pouka7:
  text: |
    # О фразнику

    Такоже можно прєгледєти [наш фразник](https://gorlatoff.github.io/fraznik.html), там јест детаљна информација о нєколикых десетках највыше важных слов.

    `.o_frazniku`


pouka8:
  text: |
    # Ако ли слова нема в словнику

    ## О боту

    Запросите јего у нашего бота @Mašina, и често будете најдти одговор. Он поступно искаје слова [во фразнику](https://gorlatoff.github.io/fraznik.html), во словнику меджусловјанского језыка, в листу с прєдложенјами новых слов, в [неофициалном корпусу слов](https://docs.google.com/spreadsheets/d/1rBG7brwbG4pR1j8_eVZapFZUSdaegSVjDH2V6Oqy00A/edit#gid=281935577), и такоже в титулах текстов из Википедије.

    Да бысте увидєли детаљне инструкције, напишите `.help` или `.pomoč` (бот работаје на серверу или такоже в личных посланјах).

    ## O slovnikah

    Често јест добро погледєти како говорет в другых језыках, тут јест малы [спис ресурсов](https://teletype.in/@mashine_of_goodness/scyLN60SDhk)
        
    p.s. Вы јесте прєгледєли вси можливе варианты и како прєдтым ничто не разумєјете и не знајете како слово потрєбно користати? Добродошли до канала **#pytanja︱вопросы** на нашем серверу в Дискорду! Може быти, в рєшенју тутого пытанја вам помогут други члени того сервера.

    `.o_botu`
  image:
    https://img4.teletype.in/files/3c/ef/3cef9634-422a-473f-8732-308104cdc41f.png


pouka9:
  text: |
    # Меджусловјанске клавиатуры

    Народне клавиатуры, имајуче все потрєбне симболы: **чешска**, **словачска**, **литовска**. Такоже можно користати **хрватску** и **словенску**, а за кирилицу — **србску** (не има `ы/y` и `е/є`), или **русинску** клавиатуру (`Њњ` и `Љљ` можно замєњати на `Нь` и `Ль`, а `Jj` на `Ii`).

    ## Прєпорученја за различне системы

    ⌨️ Android — [GBoard с опцијеју меджусловјанского језыка.](http://usachov.eu/g)
    ⌨️ iOS — чешска/словачска/литовска клавиатура за латиницу и србска клавиатура за кирилицу. Да бысте додали другы језык, отворите `Settings > General > Keyboard > Keyboards`, и натискните `Add New Keyboard…`
    ⌨️ Windows — [различне меджусловјанске клавиатуры.](http://tyflonet.com/siciliano/klaviatury/)
    ⌨️ Mac — [латинична и кирилична клавиатуры](https://github.com/orlean-git/isv_mac_keyboards). Такоже можно уживати меджународне клавјатуры (напримєр ABC Extended).
    ⌨️ Linux — разширјена МС латиница на меджународных латиничных клавиатурах (како напримєр хрватска в варианту unicodeus). Полна кириличска клавиатура јест на стандардној украјинској клавиатурє.

    `.klaviatury`


