pouka2:
  text: |
    # Додатне совєты

    ## Како најдти все формы слова, когда јего нема в словнику? Тут сут инструменты:
      • [за глаголы](http://steen.free.fr/interslavic/conjugator.html) 
      • [за именникы](http://steen.free.fr/interslavic/declinator.html)
      • [за придавникы](http://steen.free.fr/interslavic/adjectivator.html)

    ## Об етимологичных литерах

    На тутом серверу јествује тенденција писати етимологичным алфабетом. То не јест никако обвезно и ты просто можеш читати "чудне буквы" како јих највыше близкы визуалны еквивалент (`ę` како `e`, `ć` како `č`, `đ` како `dž`, `ų` како `u`, `å` како `a`, и т.д).

    Словник умєје прємєњати правопис на етимологичны, а такоже дєлати регионалну флаворизацију слов (гледи образок)

    **Ако ли ты хчеш познати то выше глубоко:**

    • [Разширјены етимологичны алфабет](https://interslavic.fun/learn/pronunciation/#etymological-alphabet-extensions)

    ## Словникы словјанскых језыков

    В нєкторых случајах јест потрєбно погледєти на друге језыкы, да бы узнати оптималну методу сказати нєчто. Тут јест [спис ресурсов](https://teletype.in/@mashine_of_goodness/scyLN60SDhk) (словникы за всакы језык и тако даље).

    `.linky2`
  image:
    https://img4.teletype.in/files/f2/c6/f2c6e58a-6bd4-4146-b8a2-01ceaa7e61a6.png
